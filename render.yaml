# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: convert-rtz
    runtime: python
    plan: free
    buildCommand: python -c "import sys; assert sys.version_info[:2] == (3, 11), f'Expected Python 3.11, got {sys.version}'" && python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: gunicorn app:server -b 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GUNICORN_CMD_ARGS
        value: "--log-level info"
    autoDeploy: true
